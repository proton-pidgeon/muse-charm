[project]
name = "vesper-node"
version = "0.1.0"
description = "Vesper node backend (task 07 / B1): push-to-talk note -> STT -> brain /ask -> TTS, over SSE"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
vesper-node = "vesper_node.app:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["vesper_node"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

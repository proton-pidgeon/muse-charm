# microWakeWord training config for "Hey Vesper" (task 21). Paths use $WW_FEAT / $WW_DATA /
# $WW_RUNS / $RUN and are expanded by 05_train.sh into $WW_RUNS/$RUN/training_parameters.yaml.
# Based on upstream notebooks/basic_training_notebook.ipynb; changes are commented.

window_step_ms: 10
train_dir: $WW_RUNS/$RUN/model

features:
  - features_dir: $WW_FEAT/positives
    sampling_weight: 2.0
    penalty_weight: 1.0
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: $WW_FEAT/hardneg          # ours: TTS near-homophones + general TTS speech
    sampling_weight: 4.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: $WW_DATA/negative_datasets/speech
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: $WW_DATA/negative_datasets/dinner_party
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: $WW_DATA/negative_datasets/no_speech
    sampling_weight: 5.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: $WW_FEAT/val_ambient      # CHiME-6 dev+eval only (validation_ambient); DipCo is not linked
    sampling_weight: 0.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: split
    type: mmap

training_steps: [20000]
positive_class_weight: [1]
negative_class_weight: [20]
learning_rates: [0.001]
batch_size: 128

time_mask_max_size: [0]
time_mask_count: [0]
freq_mask_max_size: [0]
freq_mask_count: [0]

eval_step_interval: 500
clip_duration_ms: 1500

target_minimization: 0.9
minimization_metric: null
maximization_metric: average_viable_recall
